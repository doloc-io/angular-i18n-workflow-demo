<main>
  <header>
    <a class="brand" href="./">t<span>·</span></a>
    <nav>
      <a href="/en/" lang="en">EN</a>
      <a href="/de/" lang="de">DE</a>
    </nav>
  </header>
  <section class="intro">
    <span class="eyebrow" i18n="@@app.label">A little room to focus</span>
    <h1 i18n="@@task.title">Your tasks</h1>
    <p i18n="@@task.description">Get it done today.</p>
  </section>
  <article class="task">
    <div class="check" aria-hidden="true"></div>
    <div class="task-content">
      <span class="category" i18n="@@task.category">PERSONAL</span>
      <h2 i18n="@@task.name">Plan a weekend away</h2>
      <p class="legacy" i18n="@@task.legacy">No reminders yet</p>
    </div>
    <span class="number">01</span>
  </article>
  <footer>
    <span class="dot"></span>
    <span i18n="@@app.footer">Small steps. More headspace.</span>
  </footer>
</main>
